# Builds the PROTECTED OilStudio (no readable code) on GitHub's own computers:
#   - Mac, Apple Silicon (M1-M4)
#   - Mac, Intel
#   - Windows
# Run it from the "Actions" tab > "Build OilStudio" > "Run workflow".
# When it finishes, download the zips under "Artifacts" on the run's page.
name: Build OilStudio

on:
  workflow_dispatch:          # the "Run workflow" button
  push:
    tags: ["v*"]              # or push a tag like v1.2 to build that version

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac (Apple Silicon)
            os: macos-15
            artifact: OilStudio-mac-apple-silicon
          - name: Mac (Intel)
            os: macos-15-intel
            artifact: OilStudio-mac-intel
          - name: Windows
            os: windows-latest
            artifact: OilStudio-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Node.js lets protect.py scramble the JavaScript names (terser)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller cython setuptools rjsmin rcssmin

      - name: Protect (minify, pack, compile to machine code, test)
        run: python build/protect.py --out .release

      - name: Build the app
        working-directory: .release
        run: pyinstaller --noconfirm --clean --workpath ../.pyi-work-protected --distpath ../dist-protected OilStudio-protected.spec

      - name: Zip (Mac)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist-protected/OilStudio-mac
          ditto dist-protected/OilStudio.app dist-protected/OilStudio-mac/OilStudio.app
          cp build/CLIENT-README.txt "dist-protected/OilStudio-mac/READ ME.txt"
          ditto -c -k --keepParent dist-protected/OilStudio-mac "dist-protected/${{ matrix.artifact }}.zip"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item build/CLIENT-README.txt "dist-protected/READ ME.txt"
          Compress-Archive -Force -Path dist-protected/OilStudio, "dist-protected/READ ME.txt" -DestinationPath "dist-protected/${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-protected/${{ matrix.artifact }}.zip
          retention-days: 30
